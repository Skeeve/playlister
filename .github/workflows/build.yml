name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Docker (vet, test, cross-compile, app bundles)
        run: docker build --build-arg VERSION="${GITHUB_REF_NAME}" --output dist .

      # artifacts lose file permissions, so pass the binaries on as a tarball
      - name: Pack build output
        run: tar -czf dist.tar.gz dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tar.gz

  package:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Sign macOS apps (ad hoc) and package everything
        run: |
          tar -xzf dist.tar.gz
          mkdir release
          for arch in arm64 amd64; do
            app="dist/app-$arch/Playlister.app"
            codesign --force --sign - --identifier io.github.skeeve.playlister "$app"
            codesign --verify --verbose "$app"
            ditto -c -k --keepParent "$app" "release/playlister-macos-$arch-app.zip"
          done
          cd dist
          for f in playlister-*; do
            case "$f" in
              *.exe) zip -q "../release/${f%.exe}.zip" "$f" ;;
              *)     chmod +x "$f"; tar -czf "../release/$f.tar.gz" "$f" ;;
            esac
          done
          cd ../release
          shasum -a 256 * > SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: playlister-${{ github.ref_name }}
          path: release/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Playlister $GITHUB_REF_NAME" --generate-notes release/*

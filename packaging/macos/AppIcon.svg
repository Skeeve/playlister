<!--
  Source for Resources/AppIcon.icns. Regenerating it:
  `qlmanage -t -s 1024 -o . AppIcon.svg` renders this correctly EXCEPT it
  fills everything outside the drawn shapes with opaque white instead of
  leaving it transparent. Fix: render a second, throwaway SVG containing
  only `<rect width="1024" height="1024" rx="185" fill="#000"/>` the same
  way, `-negate` that render, and use it as an alpha mask
  (`magick icon.png mask.png -alpha off -compose CopyOpacity -composite`)
  before building the .iconset and running `iconutil -c icns`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
<defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#8a5cf0"/><stop offset="100%" stop-color="#2a1f7a"/>
</linearGradient></defs>
<rect width="1024" height="1024" rx="185" fill="url(#g)"/>
<rect x="228" y="324" width="444" height="56" rx="28" fill="#ffffff"/>
<rect x="228" y="452" width="444" height="56" rx="28" fill="#ffffff"/>
<rect x="228" y="580" width="260" height="56" rx="28" fill="#ffffff"/>
<rect x="756" y="308" width="28" height="366" rx="14" fill="#ffffff"/>
<ellipse cx="712" cy="672" rx="56" ry="44" transform="rotate(-18 712 672)" fill="#ffffff"/>
</svg>
